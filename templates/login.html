<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — EmotionLearnAI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
    body {
      font-family: 'Inter', 'Segoe UI', sans-serif;
      background: #0f0f1a;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      /* Subtle animated grid */
      background-image:
        linear-gradient(rgba(0,200,81,0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0,200,81,0.03) 1px, transparent 1px);
      background-size: 40px 40px;
    }

    /* ── CARD ─────────────────────────────────── */
    .auth-card {
      background: #1a1a2e;
      border: 1px solid #2a2a3e;
      border-radius: 20px;
      padding: 44px 40px;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 24px 60px rgba(0,0,0,0.5);
      animation: cardIn 0.4s ease;
    }
    @keyframes cardIn {
      from { opacity:0; transform: translateY(20px); }
      to   { opacity:1; transform: translateY(0); }
    }

    /* ── LOGO ─────────────────────────────────── */
    .auth-logo {
      text-align: center;
      margin-bottom: 6px;
      font-size: 26px;
      font-weight: 800;
      color: #00C851;
      letter-spacing: -0.5px;
    }
    .auth-logo span { color: #fff; }
    .auth-subtitle {
      text-align: center;
      font-size: 13px;
      color: #666;
      margin-bottom: 32px;
    }

    /* ── FLASH MESSAGES ───────────────────────── */
    .flash-msg {
      border-radius: 8px;
      padding: 10px 14px;
      font-size: 13px;
      font-weight: 500;
      margin-bottom: 18px;
    }
    .flash-msg.error   { background: #FF444422; border: 1px solid #FF4444aa; color: #FF8888; }
    .flash-msg.success { background: #00C85122; border: 1px solid #00C851aa; color: #00C851; }

    /* ── FORM ─────────────────────────────────── */
    .form-group {
      margin-bottom: 18px;
    }
    .form-group label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      color: #888;
      text-transform: uppercase;
      letter-spacing: 0.7px;
      margin-bottom: 7px;
    }
    .form-group input {
      width: 100%;
      background: #0d1117;
      border: 1.5px solid #2a2a3e;
      border-radius: 10px;
      padding: 12px 14px;
      font-size: 14px;
      color: #fff;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
      font-family: inherit;
    }
    .form-group input:focus {
      border-color: #00C851;
      box-shadow: 0 0 0 3px rgba(0,200,81,0.12);
    }
    .form-group input::placeholder { color: #444; }

    /* ── SUBMIT BUTTON ────────────────────────── */
    .btn-primary {
      width: 100%;
      padding: 13px;
      background: linear-gradient(135deg, #00C851, #009933);
      border: none;
      border-radius: 10px;
      color: #fff;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      margin-top: 6px;
      transition: all 0.2s;
      font-family: inherit;
      letter-spacing: 0.3px;
    }
    .btn-primary:hover {
      background: linear-gradient(135deg, #00dd5a, #00aa3d);
      transform: translateY(-1px);
      box-shadow: 0 6px 20px rgba(0,200,81,0.35);
    }
    .btn-primary:active { transform: translateY(0); }

    /* ── FOOTER LINK ──────────────────────────── */
    .auth-footer {
      text-align: center;
      margin-top: 24px;
      font-size: 13px;
      color: #555;
    }
    .auth-footer a {
      color: #00C851;
      font-weight: 600;
      text-decoration: none;
    }
    .auth-footer a:hover { text-decoration: underline; }

    /* ── DIVIDER ──────────────────────────────── */
    .divider {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 24px 0;
      color: #333;
      font-size: 12px;
    }
    .divider::before, .divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: #2a2a3e;
    }
  </style>
</head>
<body>

<div class="auth-card">

  <!-- Logo -->
  <div class="auth-logo">🧠 Emotion<span>LearnAI</span></div>
  <div class="auth-subtitle">Sign in to continue your learning journey</div>

  <!-- Flash messages from Flask -->
  {% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}
      {% for category, message in messages %}
        <div class="flash-msg {{ category }}">{{ message }}</div>
      {% endfor %}
    {% endif %}
  {% endwith %}

  <!-- Login form -->
  <form method="POST" action="/login">

    <div class="form-group">
      <label for="username">Username</label>
      <input type="text" id="username" name="username"
             placeholder="Enter your username"
             autocomplete="username" required>
    </div>

    <div class="form-group">
      <label for="password">Password</label>
      <input type="password" id="password" name="password"
             placeholder="Enter your password"
             autocomplete="current-password" required>
    </div>

    <button type="submit" class="btn-primary">Sign In</button>

  </form>

  <div class="divider">or</div>

  <div class="auth-footer">
    Don't have an account?
    <a href="/register">Create one free</a>
  </div>

</div>

</body>
</html>
